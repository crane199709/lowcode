# classpath:/config/application.yml 优先级高于主配置并与之合并：测试不依赖 Nacos，统一在这里关闭
spring:
  datasource:
    username: demo_app
    password: demo_app
  flyway:
    user: demo_migrator
    password: demo_migrator
    schemas: demo
    default-schema: demo
    placeholders:
      serviceSchema: demo
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
# 不连接 MQ 的测试关闭投递器与消费端；发布的事件照常写入 Outbox。Outbox 链路测试单独开启并连接测试容器
forge:
  # 普通 HTTP/Schema 测试只初始化客户端；图片集成测试覆盖为真实 S3 容器。
  storage:
    endpoint: http://localhost:1
    bucket: lowcode-test
    access-key: storage-test
    secret-key: storage-test-secret
  ops:
    token: test-ops-token
  mq:
    endpoints: localhost:1
    enabled: false
  # 测试不连接 iam；清单内容由 ResourceManifestTest 直接生成校验
  manifest:
    iam-uri: http://localhost:1
    token: test-only
    enabled: false
  # 多数测试不启动 Redis 或不发布租户状态；写入保护由 TenantLifecycleTest 单独开启验证
  tenant:
    write-guard:
      enabled: false

# 测试默认禁止链路本地与私有网段；不含本机，共享容器经本机端口映射充当租户的外部数据库
lowcode:
  datasource:
    blocked-networks: 169.254.0.0/16,10.0.0.0/8
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

server:
  port: 0
